name: catch-server

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to keep trying (seconds). Default 20400 = 5h40m"
        default: "20400"
  schedule:
    - cron: "17 * * * *"   # hourly; only one run at a time, the next waits in line

concurrency:
  group: catcher
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  catch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Queue the next run right away. It waits in line (concurrency group) and
      # starts the moment this run ends, even if this run crashes or is killed.
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run catch-server --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 20
          done
          echo "::warning::Could not queue the next run; the hourly schedule is the backup"

      - name: Install OCI CLI
        run: pipx install oci-cli

      - name: Write OCI config
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/ssh_key.pub

      - name: Catch server
        id: catch
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          OCI_IMAGE: ${{ secrets.OCI_IMAGE }}
          DEADLINE: ${{ inputs.seconds || '20400' }}
        run: bash catch.sh

      - name: Announce and stop future runs
        if: steps.catch.outputs.caught == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stop the run that is waiting in line, then announce once.
          gh run list --repo "$GITHUB_REPOSITORY" --workflow catch-server --status pending --json databaseId --jq '.[].databaseId' \
            | xargs -r -n1 gh run cancel --repo "$GITHUB_REPOSITORY" || true
          gh run list --repo "$GITHUB_REPOSITORY" --workflow catch-server --status queued --json databaseId --jq '.[].databaseId' \
            | xargs -r -n1 gh run cancel --repo "$GITHUB_REPOSITORY" || true
          if [ "$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search 'Server caught in:title' --json number --jq length)" != "0" ]; then
            gh workflow disable catch-server --repo "$GITHUB_REPOSITORY"; exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Server caught" \
            --body "Oracle accepted the request. The 'minecraft' server is being created. Future catcher runs are now disabled."
          gh workflow disable catch-server --repo "$GITHUB_REPOSITORY"

      - name: Remove credentials
        if: always()
        run: rm -rf ~/.oci ~/ssh_key.pub
